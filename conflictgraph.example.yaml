version: 1
workers: 4
risk_policy: balanced
seed: 42
artifact_dir: artifacts
database_url: postgresql://conflictgraph:conflictgraph@localhost:5432/conflictgraph
api_address: 0.0.0.0:8080
tracing:
  mode: replay
  redact_paths: false
  hash_salt: change-me
  exclude_prefixes:
    - /proc
    - /sys
    - /usr/lib
    - /System
  minimum_quality: 0.8
  cgroup_root: /sys/fs/cgroup/conflictgraph
  control_socket: /run/conflictgraph/tracer.sock
scheduler:
  risk_weight: 2.0
  hard_threshold: 0.9
  refinement_rounds: 4
model:
  artifact: artifacts/model
  default_no_edge_risk: 0.001
