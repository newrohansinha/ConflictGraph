apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controlplane
  labels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: controlplane }
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: controlplane } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: controlplane }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: controlplane
          image: {{ .Values.controlPlane.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [serve, -config, /etc/conflictgraph/conflictgraph.yaml]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: CONFLICTGRAPH_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: {{ .Values.postgres.secretKey }} } }
            - name: CONFLICTGRAPH_HASH_SALT
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-tracer, key: hash-salt } }
          volumeMounts:
            - { name: config, mountPath: /etc/conflictgraph, readOnly: true }
            - { name: artifacts, mountPath: /var/lib/conflictgraph, readOnly: true }
          readinessProbe: { httpGet: { path: /api/v1/health, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: http }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources: {{ toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
      volumes:
        - { name: config, configMap: { name: {{ .Release.Name }}-config } }
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-artifacts" .Release.Name) .Values.artifacts.existingClaim }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-controlplane }
spec:
  selector: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: controlplane }
  ports: [{ name: http, port: 8080, targetPort: http }]
