apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: dashboard }
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: dashboard } }
  template:
    metadata: { labels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: dashboard } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env: [{ name: CONFLICTGRAPH_API_URL, value: http://{{ .Release.Name }}-analysis:8090 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 20 }
          resources: {{ toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-dashboard }
spec:
  selector: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: dashboard }
  ports: [{ name: http, port: 3000, targetPort: http }]
