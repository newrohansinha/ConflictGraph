{{- if .Values.tracer.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-tracer
  labels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: tracer }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: tracer } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: conflictgraph, app.kubernetes.io/component: tracer }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9465" }
    spec:
      hostPID: true
      serviceAccountName: {{ .Release.Name }}-tracer
      tolerations: [{ operator: Exists }]
      containers:
        - name: tracer
          image: {{ .Values.tracer.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [--mode, ebpf, --metrics-address, 0.0.0.0:9465, --redact-paths]
          env:
            - name: CONFLICTGRAPH_HASH_SALT
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-tracer, key: hash-salt } }
          ports: [{ name: metrics, containerPort: 9465 }]
          securityContext:
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            capabilities: { add: [BPF, PERFMON, SYS_RESOURCE], drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: bpffs, mountPath: /sys/fs/bpf }
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
            - { name: runtime, mountPath: /run/conflictgraph }
          resources: {{ toYaml .Values.tracer.resources | nindent 12 }}
      volumes:
        - { name: bpffs, hostPath: { path: /sys/fs/bpf, type: Directory } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup, type: Directory } }
        - { name: runtime, hostPath: { path: /run/conflictgraph, type: DirectoryOrCreate } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ .Release.Name }}-tracer }
automountServiceAccountToken: false
{{- end }}
