name: Privileged eBPF integration
on:
  workflow_dispatch:
  schedule: [{ cron: "17 3 * * 1" }]
permissions:
  contents: read
jobs:
  tracer:
    runs-on: [self-hosted, linux, x64, ebpf, cgroup-v2]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - run: ./scripts/build-ebpf.sh
      - run: sudo -E ./scripts/test-ebpf.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ebpf-integration-traces, path: artifacts/ebpf-integration }
