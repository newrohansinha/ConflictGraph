[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conflictgraph"
version = "0.1.0"
description = "ML-driven CI test interference detection and scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.1",
  "PyYAML>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1",
  "torch-geometric>=2.5",
  "scikit-learn>=1.3",
  "polars>=0.20",
]
api = ["fastapi>=0.141.1,<1", "uvicorn>=0.27", "psycopg[binary,pool]>=3.1", "prometheus-client>=0.20"]
benchmark = ["redis>=5,<8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8,<2", "httpx2>=2.10", "types-PyYAML>=6.0"]

[project.scripts]
conflictgraph = "conflictgraph.cli:app"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
conflictgraph = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: integration tests", "linux: requires Linux kernel facilities"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP035", "UP037", "UP045", "B008", "SIM105", "SIM108", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conflictgraph"]

[[tool.mypy.overrides]]
module = ["polars", "sklearn.*", "torch", "torch.*", "torch_geometric.*"]
ignore_missing_imports = true
